services:
  isyone-api:
    build: .
    container_name: isyone-secure-api
    ports:
      - "5000:5000"
    environment:
      - ISY_INITIAL_TOKEN=isyone-dev-token
      - ISY_DATA_DIR=/app/data
      - ISY_SCRIPTS_DIR=/app/scripts
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    restart: unless-stopped
